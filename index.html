<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gestor de diseños</title>
  <meta name="theme-color" content="#b4532a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Diseños">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root {
      --bg: #f6f3ec; --card: #ffffff; --ink: #23201b; --muted: #776f63; --line: #e7e1d5;
      --accent: #b4532a; --accent-ink: #ffffff; --accent-soft: #f6e3d8;
      --warn: #b86e12; --warn-soft: #fbecd6; --bad: #b3372b; --bad-soft: #f8dfdb;
      --mid: #b08a00; --mid-dot: #e3b505; --mid-soft: #fbf2c9;
      --tup: #2f6f9a; --tup-soft: #e1edf6;
      --low: #5b5bb0; --low-soft: #e6e6f6; --shadow: 0 1px 2px rgba(40,30,10,.06), 0 4px 14px rgba(40,30,10,.06);
      --r: 14px; --tab-h: 64px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #171614; --card: #22201d; --ink: #f1ece3; --muted: #a59d90; --line: #35322d;
        --accent: #e9966b; --accent-ink: #2a140a; --accent-soft: #3d261b;
        --warn: #f0a650; --warn-soft: #3b2c18; --bad: #f07d6e; --bad-soft: #3e211d;
        --mid: #f2d052; --mid-dot: #f2d052; --mid-soft: #39321a;
        --tup: #8cc0e6; --tup-soft: #1c2c39;
        --low: #a3a3f0; --low-soft: #2a2a45; --shadow: 0 1px 2px rgba(0,0,0,.3);
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
        --bg: #171614; --card: #22201d; --ink: #f1ece3; --muted: #a59d90; --line: #35322d;
        --accent: #e9966b; --accent-ink: #2a140a; --accent-soft: #3d261b;
        --warn: #f0a650; --warn-soft: #3b2c18; --bad: #f07d6e; --bad-soft: #3e211d;
        --mid: #f2d052; --mid-dot: #f2d052; --mid-soft: #39321a;
        --tup: #8cc0e6; --tup-soft: #1c2c39;
        --low: #a3a3f0; --low-soft: #2a2a45; --shadow: 0 1px 2px rgba(0,0,0,.3);
        color-scheme: dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); }
    body {
      font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh; overscroll-behavior-y: none;
      padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom));
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    /* Cabecera */
    .top {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
      padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: var(--bg);
      border-bottom: 1px solid var(--line);
    }
    .top h1 { font-size: 22px; margin: 0; flex: 1; letter-spacing: -.01em; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--card);
      border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--muted); white-space: nowrap;
    }
    .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .pill.ok::before { background: var(--accent); }
    .pill.warn { color: var(--warn); } .pill.warn::before { background: var(--warn); }
    .pill.bad { color: var(--bad); } .pill.bad::before { background: var(--bad); }
    .pill.busy::before { background: var(--accent); animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: .2; } }
    .icon-btn { border: 0; background: transparent; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); }
    .icon-btn:active { background: var(--line); }
    .icon-btn.light { color: #fff; }
    .ic { display: inline-grid; place-items: center; width: 22px; height: 22px; }
    .ic svg { width: 100%; height: 100%; }

    main { padding: 12px 16px 96px; max-width: 1280px; margin: 0 auto; }

    /* Barra inferior */
    .tabbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
      justify-items: center; align-items: center; height: calc(var(--tab-h) + env(safe-area-inset-bottom)); padding: 0 8px env(safe-area-inset-bottom);
      background: var(--card); border-top: 1px solid var(--line);
    }
    .tab { border: 0; background: none; display: grid; justify-items: center; gap: 2px; font-size: 12px; color: var(--muted); padding: 6px 0; position: relative; }
    .tab.on { color: var(--accent); font-weight: 600; }
    .tab[hidden] { display: none; }
    .tab .count { position: absolute; top: 0; left: calc(50% + 6px); background: var(--bad); color: #fff; font-size: 11px; border-radius: 9px; padding: 0 5px; min-width: 18px; line-height: 18px; }
    .fab {
      position: fixed; right: 16px; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom)); z-index: 25;
      height: 48px; padding: 0 18px 0 14px; border-radius: 24px; border: 0; background: var(--ink); color: var(--bg);
      display: flex; align-items: center; gap: 6px; font-weight: 600; box-shadow: var(--shadow);
    }

    /* Buscador y filtros */
    .search { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; }
    .search input { border: 0; outline: 0; background: none; flex: 1; height: 44px; min-width: 0; }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 13px; font-size: 14px; white-space: nowrap; }
    .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .chip small { opacity: .7; margin-left: 4px; }
    select.chip { appearance: none; padding-right: 26px; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 14px) 50%, calc(100% - 9px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }

    /* Filas */
    .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 8px; }
    .row { min-width: 0; }
    .row {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); min-height: 64px;
    }
    .row:active { transform: scale(.995); }
    .plain { border: 0; background: none; padding: 0; text-align: left; }
    .row-main { flex: 1; min-width: 0; }
    .row-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row-qty { text-align: right; line-height: 1.1; }
    .row-qty b { font-size: 20px; display: block; }
    .row-qty small { color: var(--muted); }
    .row-qty.zero b { color: var(--bad); }
    .thumb {
      width: 44px; height: 44px; border-radius: 12px; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 18px;
      background: hsl(var(--hue) 45% 88%); color: hsl(var(--hue) 40% 30%); background-size: cover; background-position: center;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .thumb { background-color: hsl(var(--hue) 25% 25%); color: hsl(var(--hue) 50% 80%); } }
    :root[data-theme="dark"] .thumb { background-color: hsl(var(--hue) 25% 25%); color: hsl(var(--hue) 50% 80%); }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .badge { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--line); color: var(--muted); }
    .badge.warn { background: var(--warn-soft); color: var(--warn); }
    .badge.bad { background: var(--bad-soft); color: var(--bad); }
    .badge.low { background: var(--low-soft); color: var(--low); }
    .badge.ok { background: var(--accent-soft); color: var(--accent); }

    .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
    .empty .ic { width: 48px; height: 48px; opacity: .5; margin-bottom: 8px; }
    .section-h { display: flex; align-items: baseline; justify-content: space-between; margin: 18px 2px 4px; }
    .section-h h3 { margin: 0; font-size: 15px; }
    .section-h small { color: var(--muted); }

    /* Lista de la compra */
    .item { gap: 10px; }
    .check { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); background: none; flex: none; padding: 0; display: grid; place-items: center; }
    .item.done { opacity: .55; box-shadow: none; }
    .item.done .check { background: var(--accent); color: var(--accent-ink); }
    .item.done .row-title { text-decoration: line-through; }
    .add-form { display: flex; gap: 8px; margin-top: 12px; }
    .add-form input { flex: 1; min-width: 0; }
    .linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 8px 2px; }

    /* Formularios */
    .inp, select.inp, textarea.inp { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 0 12px; outline: 0; }
    textarea.inp { height: 90px; padding: 10px 12px; resize: vertical; }
    .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .field { display: grid; gap: 4px; margin-bottom: 12px; align-content: start; }
    .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }
    .hint { color: var(--muted); font-size: 12px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .toggle span:first-child { flex: 1; }
    .toggle small { display: block; color: var(--muted); font-size: 12px; }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .sw { width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; transition: background .15s; }
    .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
    .toggle input:checked + .sw { background: var(--accent); }
    .toggle input:checked + .sw::after { transform: translateX(18px); }
    fieldset { border: 0; padding: 0; margin: 18px 0 6px; }
    legend { font-weight: 700; font-size: 15px; margin-bottom: 8px; padding: 0; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 46px; padding: 0 16px; border-radius: 12px;
      border: 1px solid var(--line); background: var(--card); font-weight: 600;
    }
    .btn:disabled { opacity: .45; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
    .btn.danger { color: var(--bad); }
    .btn.block { width: 100%; margin-top: 10px; }
    .btn.small { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
    .actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .actions .btn { padding: 0 8px; }

    /* Hojas inferiores */
    .backdrop { position: fixed; inset: 0; z-index: 50; background: rgba(20,15,5,0); display: flex; align-items: flex-end; justify-content: center; transition: background .2s; }
    .backdrop.open { background: rgba(20,15,5,.42); }
    .sheet {
      width: 100%; max-width: 640px; max-height: 92dvh; display: flex; flex-direction: column; background: var(--bg);
      border-radius: 20px 20px 0 0; transform: translateY(100%); transition: transform .22s ease-out;
    }
    .backdrop.open .sheet { transform: none; }
    .sheet-head { display: flex; align-items: center; gap: 8px; padding: 14px 10px 6px 18px; }
    .sheet-head h2 { margin: 0; font-size: 19px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sheet-body { overflow-y: auto; padding: 4px 18px calc(22px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch; }
    .sheet h3 { font-size: 15px; margin: 18px 0 8px; }
    .hero { width: 100%; max-height: 220px; object-fit: cover; border-radius: var(--r); display: block; margin-bottom: 10px; background: var(--line); }
    .meta-line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
    .stock { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
    .stock .big { font-size: 34px; }
    .muted { color: var(--muted); font-size: 14px; }
    .notes { white-space: pre-wrap; background: var(--card); border-radius: 10px; padding: 10px 12px; border: 1px solid var(--line); margin: 0; }
    .lot { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; }
    .lot .row-main { font-size: 14px; }
    .stepper { display: flex; align-items: center; gap: 4px; }
    .stepper b { min-width: 46px; text-align: center; }
    .stepper button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: grid; place-items: center; padding: 0; }
    .var-row { display: grid; grid-template-columns: 1fr 1.2fr auto auto; gap: 6px; align-items: center; margin-bottom: 8px; }
    .var-row .inp { height: 42px; padding: 0 10px; }
    .fav { width: 38px; height: 42px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--muted); padding: 0; font-size: 18px; }
    .fav.on { color: #e0a100; border-color: #e0a100; }
    .codebox { display: flex; gap: 4px; }
    .codebox .inp { min-width: 0; }
    .codebox button { flex: none; width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); display: grid; place-items: center; padding: 0; }
    .photo-box { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .photo-box .thumb { width: 72px; height: 72px; border-radius: 14px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 14px 12px; margin-bottom: 14px; }
    .card h3 { margin: 12px 0 4px; font-size: 16px; }
    .card p { margin: 6px 0; }
    .note-box { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin: 8px 0; }
    .err { color: var(--bad); font-size: 13px; word-break: break-word; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .pick-row { margin-bottom: 6px; }

    /* Avisos breves */
    #toasts { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tab-h) + 14px + env(safe-area-inset-bottom)); z-index: 80; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
    .toast { pointer-events: auto; display: flex; align-items: center; gap: 14px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 11px 14px; font-size: 14px; box-shadow: var(--shadow); max-width: 520px; animation: up .2s ease-out; }
    .toast button { border: 0; background: none; color: var(--accent); font-weight: 700; filter: brightness(1.4); padding: 0; }
    @keyframes up { from { transform: translateY(12px); opacity: 0; } }

    /* ── Gestor de diseños ── */
    .narrow { max-width: 640px; margin: 0 auto; }
    .chipset { display: flex; flex-wrap: wrap; gap: 6px; }
    .chipset .chip { padding: 6px 12px; }
    .chips .chip .n { opacity: .65; margin-left: 5px; font-size: 12px; }
    .tags-inp { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 6px 8px; }
    .tags-inp:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .tags-inp input { border: 0; outline: 0; background: none; flex: 1; min-width: 90px; height: 30px; }
    .tag { border: 0; background: var(--accent-soft); color: var(--ink); border-radius: 8px; padding: 4px 6px 4px 9px; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
    .tag-x { opacity: .55; font-size: 16px; line-height: 1; }

    .bar { display: flex; gap: 8px; align-items: center; }
    .bar .search { flex: 1; }
    .bar .icon-btn { border: 1px solid var(--line); background: var(--card); border-radius: 12px; width: 46px; height: 46px; flex: none; position: relative; }
    .bar .icon-btn.on { border-color: var(--accent); color: var(--accent); }
    .dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
    .strip { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-weight: 600; }
    .strip .ic { color: var(--accent); }
    .strip small { margin-left: auto; color: var(--muted); font-weight: 400; }
    .strip.warn .ic { color: var(--warn); }
    .strip.soft { font-weight: 400; flex-wrap: wrap; }
    .strip.soft span { flex: 1; min-width: 160px; }
    .strip.soft .linkbtn { padding: 4px 6px; font-weight: 600; }
    .progressbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 10px 0; }
    .progressbar i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
    .difflist { padding-left: 18px; } .difflist li { margin: 3px 0; }
    .difflist li.add { color: #1f5c41; } .difflist li.del { color: var(--bad); } .difflist li.chg { color: var(--warn); }
    .imp { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px 8px; margin-bottom: 8px; background: var(--bg); }
    .imp.off { opacity: .6; }
    .imp-sub { font-size: 13px; color: var(--muted); margin: 2px 0; padding-left: 0; list-style: none; }
    .imp-doubts { font-size: 13px; color: var(--warn); margin: 4px 0; padding-left: 18px; }
    .imp-warn { font-size: 13px; color: var(--bad); margin: 2px 0; }
    .tfield { border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px 2px; margin-bottom: 8px; background: var(--bg); }
    .tfield.off { opacity: .6; }

    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--card-w, 160px), 1fr)); gap: 10px; margin-top: 10px; }
    body[data-cards="s"] { --card-w: 120px; } body[data-cards="l"] { --card-w: 220px; }
    .wcard { display: flex; flex-direction: column; text-align: left; padding: 0; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); position: relative; min-width: 0; }
    .wcard:active { transform: scale(.99); }
    .wcard.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
    .wphoto { aspect-ratio: 1 / 1; width: 100%; background: var(--line); display: grid; place-items: center; overflow: hidden; }
    .wphoto img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .wphoto, .pth, .ficon { position: relative; }
    .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
    .wphoto .ph { font-size: 34px; opacity: .55; }
    img:not([src]) { visibility: hidden; }
    .wbar { height: 4px; display: flex; }
    .wbar i { flex: 1; }
    .wbody { padding: 7px 10px 9px; min-width: 0; }
    .wcode { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .03em; display: flex; align-items: center; gap: 6px; }
    .wname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wnext { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wflag { position: absolute; top: 6px; right: 6px; background: var(--warn); color: #fff; border-radius: 8px; padding: 3px; display: grid; }
    .wflag .ic { width: 15px; height: 15px; }
    .wcard { cursor: pointer; }
    .wcard:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .wask { position: absolute; left: 6px; bottom: 6px; display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 999px; padding: 5px 9px 5px 7px; font-size: 12px; font-weight: 700; background: rgba(255,255,255,.9); color: #23201b; box-shadow: 0 1px 4px rgba(0,0,0,.18); min-height: 30px; }
    .wask .ic { width: 15px; height: 15px; }
    .wask b { font-weight: 800; }
    .wask.has { background: var(--accent); color: var(--accent-ink); }
    .wask.static { pointer-events: none; padding-right: 9px; }
    .wask:active { transform: scale(.94); }
    .ficon.big { width: 52px; height: 52px; }
    .ficon.big img { width: 100%; height: 100%; object-fit: contain; }
    .who { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }

    table.wt { width: 100%; border-collapse: collapse; margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 14px; }
    table.wt th { text-align: left; font-size: 12px; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    table.wt td { padding: 7px 10px; border-bottom: 1px solid var(--line); max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    table.wt img { width: 34px; height: 34px; object-fit: contain; border-radius: 6px; background: var(--line); display: block; }

    .fab2 { position: fixed; right: 16px; bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom)); z-index: 25; width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(180,83,42,.35); }
    .fab2 .ic { width: 28px; height: 28px; }
    .fab2.cam { width: 48px; height: 48px; right: 22px; bottom: calc(var(--tab-h) + 88px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg); box-shadow: var(--shadow); }
    .fab2.cam .ic { width: 22px; height: 22px; }
    .scrollx { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .mdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
    .mdot.good { background: #2f7d5b; } .mdot.mid { background: var(--warn); } .mdot.bad { background: var(--bad); }
    table.wt .ph { display: none; }

    /* Ficha */
    .fhero { position: relative; background: var(--line); border-radius: var(--r); overflow: hidden; margin-bottom: 10px; display: grid; place-items: center; min-height: 120px; }
    .fhero img { width: 100%; max-height: 300px; object-fit: contain; display: block; }

    .ftitle { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .ftitle .inp { font-size: 19px; font-weight: 700; height: 48px; }
    .codechip { font-weight: 800; letter-spacing: .04em; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 4px 9px; font-size: 14px; white-space: nowrap; }
    .staterow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
    .statebtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--ink); border-radius: 999px; padding: 6px 8px 6px 13px; font-weight: 600; }
    .statebtn .ic { width: 16px; height: 16px; color: var(--accent); }
    .steps { display: flex; gap: 3px; flex: 1; min-width: 80px; }
    .steps i { height: 5px; flex: 1; border-radius: 3px; background: var(--line); }
    .steps i.on { background: var(--accent); }
    details.sec { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 10px; }
    details.sec > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 12px 14px; font-weight: 700; cursor: pointer; }
    details.sec > summary::-webkit-details-marker { display: none; }
    details.sec > summary .ic { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; }
    details.sec[open] > summary .ic { transform: rotate(90deg); }
    details.sec > summary small { margin-left: auto; color: var(--muted); font-weight: 400; }
    .sec-body { padding: 2px 14px 12px; }
    .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
    .pth { position: relative; aspect-ratio: 1/1; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--line); padding: 0; display: grid; place-items: center; }
    .pth img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pth .star { position: absolute; left: 4px; top: 4px; background: var(--accent); color: #fff; border-radius: 6px; padding: 2px; display: grid; }
    .pth .star .ic { width: 13px; height: 13px; }
    .pth .pend, .frow .pend { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.55); color: #fff; border-radius: 6px; padding: 2px; display: grid; }
    .pth .pend .ic { width: 13px; height: 13px; }
    .pth.add { border-style: dashed; background: none; color: var(--muted); font-size: 12px; gap: 2px; align-content: center; }
    button.frow { width: 100%; text-align: left; }
    .frow > .ic { width: 16px; height: 16px; color: var(--muted); flex: none; }
    .pvs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .pvs.one { grid-template-columns: 1fr; }
    .pv { position: relative; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; aspect-ratio: 3 / 4; display: grid; place-items: center; }
    .pvs.one .pv { aspect-ratio: 16 / 10; }
    .pv img { max-width: 92%; max-height: 92%; object-fit: contain; display: block; }
    .pvl { position: absolute; left: 6px; bottom: 6px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.85); color: #23201b; }
    .chk { display: flex; gap: 10px; align-items: baseline; font-size: 14px; padding: 5px 0; }
    .chk b { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--line); color: var(--muted); align-self: flex-start; }
    .chk.ok b { background: #e2efe8; color: #1f5c41; }
    .chk.warn b { background: var(--warn-soft); color: var(--warn); }
    .chk.warn span { color: var(--warn); }
    .frow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; background: var(--bg); }
    .ficon { width: 40px; height: 40px; border-radius: 8px; background: var(--line); display: grid; place-items: center; flex: none; overflow: hidden; color: var(--muted); }
    .ficon img { width: 100%; height: 100%; object-fit: cover; }
    .frow select { border: 1px solid var(--line); border-radius: 8px; background: var(--card); height: 34px; max-width: 130px; }
    .vcard { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; margin-bottom: 6px; background: var(--bg); }
    .vcard .price { font-weight: 700; white-space: nowrap; }
    .mrg { border-radius: 10px; padding: 9px 12px; font-size: 14px; margin: 4px 0 12px; background: var(--accent-soft); }
    .mrg.good { background: #e2efe8; color: #1f5c41; } .mrg.mid { background: var(--warn-soft); color: var(--warn); } .mrg.bad { background: var(--bad-soft); color: var(--bad); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mrg.good { background: #1f3a2d; color: #8fd1ae; } }
    :root[data-theme="dark"] .mrg.good { background: #1f3a2d; color: #8fd1ae; }
    .progress { font-size: 12px; color: var(--muted); }
    .drop-on { outline: 3px dashed var(--accent); outline-offset: -6px; }
    .hist { border-left: 2px solid var(--line); padding: 0 0 12px 12px; margin-left: 4px; }
    .hist b { font-size: 14px; }
    .hist .ch { font-size: 14px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-top: 4px; }
    .hist .old { color: var(--muted); text-decoration: line-through; }
    .viewer { position: fixed; inset: 0; z-index: 70; background: rgba(15,12,8,.94); display: flex; flex-direction: column; }
    .viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
    .viewer .vbar { display: flex; gap: 8px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom)); justify-content: center; flex-wrap: wrap; }
    .viewer .vtop { display: flex; justify-content: space-between; align-items: center; padding: calc(8px + env(safe-area-inset-top)) 8px 0 14px; color: #fff; }
    .swatches { display: flex; gap: 8px; }
    .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
    .swatch.on { border-color: var(--ink); }
    .prow { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
    .inline { display: flex; gap: 8px; align-items: center; }
    .inline .inp { flex: 1; min-width: 0; }
    .unit { color: var(--muted); font-size: 14px; white-space: nowrap; }
    .ibox { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; margin-bottom: 10px; display: flex; gap: 12px; }
    .ibox img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; background: var(--line); flex: none; }
    .ibox .btn-row { margin-top: 6px; }
    .shots { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
    .shots .pth { width: 84px; flex: none; }

    /* Pantalla ancha: la ficha se abre a la derecha y la galería sigue a la vista */
    @media (min-width: 1000px) {
      .backdrop.side { background: none !important; pointer-events: none; justify-content: flex-end; align-items: stretch; z-index: 40; }
      .backdrop.side .sheet { pointer-events: auto; width: 540px; max-width: 540px; max-height: none; height: 100dvh; border-radius: 0; border-left: 1px solid var(--line); transform: translateX(100%); box-shadow: -10px 0 30px rgba(40,30,10,.10); }
      .backdrop.side.open .sheet { transform: none; }
      body.has-side main, body.has-side .top { margin-right: 540px; }
      body.has-side .tabbar { right: 540px; }
      body.has-side .fab2.main, body.has-side #toasts { right: 556px; }
      body.has-side .fab2.cam { right: 562px; }
      .backdrop:not(.side) { align-items: center; }
      .backdrop:not(.side) .sheet { border-radius: 20px; max-height: 88dvh; }
    }
    @media (max-width: 999px) { .only-wide { display: none !important; } }
  </style>
</head>
